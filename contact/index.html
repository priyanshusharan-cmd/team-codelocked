<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · TeamCodeLocked</title>
  <meta name="description" content="Get in touch with TeamCodeLocked, the tech team of B.M.S. College of Engineering, Bengaluru.">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32">
      <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M20.6 12.3a6 6 0 1 0 0 7.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m21.5 7.5-8.4 5.4a2 2 0 0 1-2.2 0L2.5 7.5"/></g></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".6" fill="currentColor"/></g></symbol>
    <symbol id="i-linkedin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M16 8.5a5.5 5.5 0 0 1 5.5 5.5v6.5h-3.7V14a1.8 1.8 0 0 0-3.6 0v6.5h-3.7V14A5.5 5.5 0 0 1 16 8.5z"/><rect x="2.5" y="9.5" width="3.7" height="11"/><circle cx="4.35" cy="4.6" r="1.9"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 10c0 5.6-7.5 11.5-7.5 11.5S4.5 15.6 4.5 10a7.5 7.5 0 0 1 15 0z"/><circle cx="12" cy="10" r="2.8"/></g></symbol>
  </svg>


  <main>
    <section class="scrolly" aria-label="Contact TeamCodeLocked">
      <div class="stage">
        <div class="hero">
          <h1>Let’s talk<span class="accent">.</span></h1>
          <div class="hero-actions">
            <a class="btn" href="#contact">Write to us</a>
          </div>
        </div>

        <div class="frame">
          <div class="frame-bg" aria-hidden="true"></div>
          <div class="frame-head">
            <span class="avatar"><svg><use href="#logo"/></svg></span>
            <strong>TeamCodeLocked</strong>
          </div>

          <div class="grid">
            <div class="slot" style="grid-area:a"></div>
            <div class="slot" style="grid-area:b"></div>
            <div class="slot" style="grid-area:c"></div>
            <div class="slot" style="grid-area:d"></div>
            <div class="slot" style="grid-area:e"></div>
            <div class="slot" style="grid-area:f"></div>

            <!-- Swap the images in assets/placeholders/ for real photos -->
            <figure class="card" data-card="a" style="grid-area:a"><img src="assets/placeholders/team.svg" alt="Core team"></figure>
            <figure class="card" data-card="b" style="grid-area:b"><img src="assets/placeholders/orientation.svg" alt="Club Orientation 2026"></figure>
            <figure class="card" data-card="c" style="grid-area:c"><img src="assets/placeholders/utsav.svg" alt="Utsav 2025"></figure>
            <a class="card card-social" data-card="d" style="grid-area:d" href="https://www.instagram.com/teamcodelocked/" target="_blank" rel="noopener">
              <svg class="social-ic"><use href="#i-insta"/></svg>
              <span>@teamcodelocked <svg class="arrow"><use href="#i-arrow"/></svg></span>
            </a>
            <figure class="card" data-card="e" style="grid-area:e"><img src="assets/placeholders/bitbybit.svg" alt="BitByBit 2.0"></figure>
            <a class="card card-social" data-card="f" style="grid-area:f" href="https://www.linkedin.com/company/teamcodelocked/" target="_blank" rel="noopener">
              <svg class="social-ic"><use href="#i-linkedin"/></svg>
              <span>LinkedIn <svg class="arrow"><use href="#i-arrow"/></svg></span>
            </a>
          </div>

          <nav class="dock" aria-label="Quick contact">
            <a href="#contact" aria-label="Write to us"><svg><use href="#i-mail"/></svg></a>
            <a href="https://www.instagram.com/teamcodelocked/" target="_blank" rel="noopener" aria-label="Instagram"><svg><use href="#i-insta"/></svg></a>
            <a href="https://www.linkedin.com/company/teamcodelocked/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg><use href="#i-linkedin"/></svg></a>
            <a href="https://maps.google.com/?q=BMS+College+of+Engineering+Bengaluru" target="_blank" rel="noopener" aria-label="BMSCE on Maps"><svg><use href="#i-pin"/></svg></a>
          </nav>
        </div>
      </div>
    </section>

    <section id="contact" class="contact">
      <div class="contact-side">
        <h2>Write to us<span class="accent">.</span></h2>
        <ul class="links">
          <li><a href="https://www.instagram.com/teamcodelocked/" target="_blank" rel="noopener"><svg><use href="#i-insta"/></svg>Instagram<svg class="arrow"><use href="#i-arrow"/></svg></a></li>
          <li><a href="https://www.linkedin.com/company/teamcodelocked/" target="_blank" rel="noopener"><svg><use href="#i-linkedin"/></svg>LinkedIn<svg class="arrow"><use href="#i-arrow"/></svg></a></li>
          <li><a href="https://maps.google.com/?q=BMS+College+of+Engineering+Bengaluru" target="_blank" rel="noopener"><svg><use href="#i-pin"/></svg>BMSCE, Bengaluru<svg class="arrow"><use href="#i-arrow"/></svg></a></li>
          <!-- TODO: add the official club email here -->
        </ul>
      </div>

      <!-- TODO: static site, so hook this up to a form service (e.g. Formspree) -->
      <form class="form" id="contact-form" novalidate>
        <input name="name" type="text" autocomplete="name" placeholder="Name" aria-label="Name" required>
        <input name="email" type="email" autocomplete="email" placeholder="Email" aria-label="Email" required>
        <textarea name="message" rows="5" placeholder="Message" aria-label="Message" required></textarea>
        <div class="form-foot">
          <button class="btn" type="submit">Send</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>


  <script src="script.js"></script>
</body>
</html>
